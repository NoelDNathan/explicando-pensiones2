<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Calculadora fiscal · reel</title>
<!--
  Reel de 15 s (1080×1920, 128 bpm) de la calculadora fiscal. Sin voz y sin ninguna cifra.
  Hilo: el punto de la «?» es una moneda que rebota por la nómina, la compra, la gasolina,
  la luz, la casa y el coche; cada sitio la sella con su impuesto; «en todo»; nadie te da el
  ticket completo; el total es «¿?» y la moneda acaba siendo el punto de la «i» de «fiscal».
  window.renderAt(t, frame) pinta un instante de forma determinista; build.py lo graba.
-->
<style>
@font-face { font-family: "Anybody"; src: url("../tiktok/fonts/anybody-latin-wdth-normal.woff2") format("woff2"); font-weight: 100 900; font-stretch: 50% 150%; }
@font-face { font-family: "Instrument Sans"; src: url("../tiktok/fonts/instrument-sans-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
@font-face { font-family: "Instrument Sans"; src: url("../tiktok/fonts/instrument-sans-latin-700-normal.woff2") format("woff2"); font-weight: 700; }

/* Tokens copiados de src/components/fiscal-worker-dashboard/FiscalSoftTheme.css */
:root {

  --fiscal-stage-copy: #dbe4ec;
  --fiscal-stage-blue: #bdd4ef;
  --fiscal-stage-violet: #d5c9ee;
  --fiscal-stage-yellow: #efd7a0;
  --fiscal-stage-red: #efc5cc;
  --fiscal-stage-green: #b6ded3;
  --fiscal-stage-positive-fill: #18865b;
  --fiscal-stage-yellow-fill: #9a7418;
  --fiscal-stage-red-fill: #c4455b;
  --fiscal-stage-blue-fill: #2f6fce;

  --fiscal-stage-yellow-paper: #fff7d9;

html, body { margin: 0; background: var(--fiscal-stage); }

  background-image: linear-gradient(90deg, color-mix(in srgb, var(--fiscal-paper-ink) 7%, transparent), transparent 12%, transparent 88%, color-mix(in srgb, var(--fiscal-paper-ink) 7%, transparent)); }

<body>
<div id="stage"><div id="cam"></div></div>
<button id="play" type="button">▶ Reproducir</button>
<script>
'use strict';
const W = 1080, H = 1920, DUR = 15, B = 60 / 128;
const b = n => n * B;
const stage = document.getElementById('stage'), cam = document.getElementById('cam');
const clamp = (x, a = 0, c = 1) => Math.min(c, Math.max(a, x));
const lerp = (a, c, t) => a + (c - a) * t;
const P = (t, a, d) => clamp((t - a) / d);
const E = {
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  inExpo: x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10),
  inQuad: x => x * x,
  inCubic: x => x * x * x,
  outCubic: x => 1 - Math.pow(1 - x, 3),
  outQuart: x => 1 - Math.pow(1 - x, 4),
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  outBack: (x, s = 1.9) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2),
};
const wob = (tau, amp, f = 38, d = 13) => tau < 0 ? 0 : amp * Math.exp(-tau * d) * Math.cos(tau * f);
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function el(tag, cls, parent, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; (parent || cam).appendChild(e); return e; }
const tok = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const vf = (s, w, g) => { s.style.fontVariationSettings = `'wdth' ${w.toFixed(1)}, 'wght' ${Math.round(g)}`; };
const show = (e, on) => { e.style.display = on ? '' : 'none'; return on; };

function letters(parent, text, cls) {
  const line = el('div', 'line ' + (cls || ''), parent);
  const inn = el('span', 'in', line);
  const L = [...text].map(ch => { const s = el('span', 'ch', inn); s.textContent = ch === ' ' ? ' ' : ch; return s; });
  return { line, inn, L };
}
function fit(o, width, max, w = 100, g = 900) {
  o.L.forEach(s => vf(s, w, g));
  o.line.style.fontSize = '100px';
  const m = o.inn.getBoundingClientRect().width;
  o.size = Math.min(max, 100 * width / m);
  o.line.style.fontSize = o.size + 'px';
  return o.size;
}
// Mide en un lienzo una parte de un glifo (el punto de «?», el de «i») respecto a su origen y su línea base.
function scanGlyph(ch, size, part) {
  const c = document.createElement('canvas'); c.width = Math.ceil(size * 1.6); c.height = Math.ceil(size * 2.2);
  const x = c.getContext('2d'); x.font = `900 ${size}px Anybody`; x.fillStyle = tok('--fiscal-paper-ink');
  const ox = size * 0.3, by = size * 1.5; x.fillText(ch, ox, by);
  const d = x.getImageData(0, 0, c.width, c.height).data, Wc = c.width;
  const runs = []; let cur = null;
  for (let y = 0; y < c.height; y++) {
    let mn = 1e9, mx = -1;
    for (let xx = 0; xx < Wc; xx++) if (d[(y * Wc + xx) * 4 + 3] > 128) { if (xx < mn) mn = xx; mx = xx; }
    if (mx >= 0) { if (!cur) { cur = { y0: y, y1: y, mn, mx }; runs.push(cur); } else { cur.y1 = y; cur.mn = Math.min(cur.mn, mn); cur.mx = Math.max(cur.mx, mx); } }
    else cur = null;
  }
  const R = part === 'bottom' ? runs[runs.length - 1] : runs[0];
  return { cx: (R.mn + R.mx + 1) / 2 - ox, cy: (R.y0 + R.y1 + 1) / 2 - by, r: (R.mx - R.mn + 1) / 2, top: R.y0 - by };
}
// Posición en el escenario del punto de un glifo dentro de su span (con marcador de línea base).
function anchorDot(span, g) {
  const m = el('i', 'bl', span);
  const sr = stage.getBoundingClientRect(), r = span.getBoundingClientRect(), mr = m.getBoundingClientRect();
  return { x: r.left - sr.left + g.cx, y: mr.top - sr.top + g.cy, local: { x: g.cx, y: mr.top - r.top + g.cy } };
}
function makeCoin(parent) {
  const c = el('div', 'coin', parent), face = el('div', 'face', c);
  const sign = el('b', '', face, '€'), shine = el('div', 'shine', face), sh = el('i', '', shine), cover = el('div', 'cover', c);
  return { c, face, sign, sh, cover };
}
function drawCoin(k, x, y, scale, sx, sy, rot, flip, white, shineP) {
  k.c.style.transform = `translate(${x - 72}px, ${y - 72}px) rotate(${rot}deg) scale(${scale * sx}, ${scale * sy})`;
  const c = Math.cos(flip);
  k.face.style.transform = `scaleX(${Math.max(0.07, Math.abs(c)).toFixed(3)})`;
  k.face.style.filter = `brightness(${(0.72 + 0.28 * Math.abs(c)).toFixed(3)})`;
  k.sign.style.opacity = c > 0 ? 1 : 0;
  k.cover.style.opacity = white;
  k.sh.style.left = `${lerp(-60, 130, shineP)}%`;
}
// Grano de película y textura de tampón: ruido generado con semilla, sin colores escritos.
function noiseURL(size, seed, fn) {
  const c = document.createElement('canvas'); c.width = c.height = size; const x = c.getContext('2d');
  const img = x.createImageData(size, size), r = rng(seed);
  for (let i = 0; i < size * size; i++) { const v = fn(r); img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v[0]; img.data[i * 4 + 3] = v[1]; }
  x.putImageData(img, 0, 0); return c.toDataURL();
}
function grungeURL(seed) {
  const s = 420, c = document.createElement('canvas'); c.width = c.height = s; const x = c.getContext('2d'), r = rng(seed);
  x.fillStyle = tok('--fiscal-paper-ink'); x.fillRect(0, 0, s, s);
  x.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < 900; i++) { x.globalAlpha = 0.5 + r() * 0.5; x.beginPath(); x.arc(r() * s, r() * s, 0.6 + Math.pow(r(), 3) * 7, 0, 7); x.fill(); }
  for (let i = 0; i < 14; i++) { x.globalAlpha = 0.35; x.lineWidth = 1 + r() * 3; x.beginPath(); const a = r() * s, bb = r() * s; x.moveTo(a, bb); x.lineTo(a + (r() - .5) * 160, bb + (r() - .5) * 40); x.stroke(); }
  return c.toDataURL();
}

/* ---------------------------------------------------------------- tiempos */
const LAND = [b(4), b(6), b(8), b(9), b(10), b(11)];
const ICON_Y = 760;
const STN = [
  { word: 'NÓMINA',   bg: '--fiscal-violet',             fg: '--fiscal-stage-text', top: 60 },
  { word: 'COMPRA',   bg: '--fiscal-stage-blue-fill',    fg: '--fiscal-stage-text', top: 190 },
  { word: 'GASOLINA', bg: '--fiscal-stage-red-fill',     fg: '--fiscal-stage-text', top: 90 },
  { word: 'LUZ',      bg: '--fiscal-stage-vat-10',       fg: '--fiscal-stage',      top: 90 },
  { word: 'CASA',     bg: '--fiscal-stage-positive-fill', fg: '--fiscal-stage-text', top: 90 },
  { word: 'COCHE',    bg: '--fiscal-stage',              fg: '--fiscal-stage-text', top: 225 },
];
const STAMPS = [
  { st: 0, t: b(5),    s: 'IMPUESTO SOBRE LA RENTA', big: 'IRPF', ink: '--fiscal-stage-yellow', x: 560, y: 1140, rot: -8, k: 1 },
  { st: 0, t: b(5.5),  s: 'SEGURIDAD SOCIAL', big: 'COTIZACIONES', ink: '--fiscal-stage-red', x: 530, y: 1360, rot: 5, k: .78 },
  { st: 1, t: b(7),    s: 'IMPUESTO SOBRE EL VALOR AÑADIDO', big: 'IVA', ink: '--fiscal-stage-yellow', x: 560, y: 1220, rot: -6, k: 1.1 },
  { st: 2, t: b(8.5),  s: 'IMPUESTO SOBRE', big: 'HIDROCARBUROS', ink: '--fiscal-stage', x: 540, y: 1250, rot: 7, k: .74 },
  { st: 3, t: b(9.5),  s: 'IMPUESTO SOBRE LA', big: 'ELECTRICIDAD', ink: '--fiscal-stage', x: 540, y: 1250, rot: -7, k: .78 },
  { st: 4, t: b(10.5), s: 'BIENES INMUEBLES', big: 'IBI', ink: '--fiscal-stage-yellow', x: 600, y: 1230, rot: 8, k: 1.1 },
  { st: 5, t: b(11.5), s: 'IMPUESTO DE CIRCULACIÓN', big: 'IVTM', ink: '--fiscal-stage-red', x: 520, y: 1230, rot: -6, k: 1 },
];
const HITS = [[0, 1.1], [b(1), .7], [b(2), .8], [b(4), .55], [b(16), 1.6], [b(16.5), .6], [b(17), .7], [b(17.5), .7], [b(22.5), .9], [b(25), .35], [b(30), .2]];
STAMPS.forEach(s => HITS.push([s.t, .5]));

/* ------------------------------------------------------------- escena A */
const hook = el('div', 'layer', cam);
const rings = [0, 1, 2].map(() => el('div', 'ring', hook));
const H1 = letters(hook, '¿CUÁNTOS', 'white'), H2 = letters(hook, 'IMPUESTOS', 'yellow'), H3 = letters(hook, 'PAGAS?', 'white');
const HL = [H1, H2, H3];
const Q = H3.L[5]; Q.style.position = 'relative';
const qdot = el('i', 'qdot', Q);
const hookFall = []; { const r = rng(7); HL.forEach(o => o.L.forEach(() => hookFall.push({ d: r() * .16, vx: (r() - .5) * 900, vy: -400 - r() * 700, vr: (r() - .5) * 900 }))); }

/* ------------------------------------------------------------ estaciones */
const stn = el('div', 'layer', cam);
const groups = STN.map(s => { const g = el('div', 'layer', stn); const a = el('div', 'wipe', g), w = el('div', 'wipe', g); a.style.background = 'var(--fiscal-stage-yellow)'; w.style.background = `var(${s.bg})`; return { g, a, w }; });
const iconBox = el('div', '', stn);
iconBox.innerHTML = '<svg class="icon" viewBox="0 0 600 600"><path pathLength="1"/><path pathLength="1"/><path pathLength="1"/><path pathLength="1"/></svg>';
const iconSvg = iconBox.firstChild, iconPaths = [...iconSvg.querySelectorAll('path')];
const kick = letters(stn, 'EN TU', ''); kick.line.style.top = '238px';
const words = STN.map(s => { const m = el('div', 'mask', stn); const o = letters(m, s.word, ''); o.mask = m; o.line.style.position = 'static'; o.line.style.width = '1080px'; return o; });

const circ = (cx, cy, r) => `M${cx - r} ${cy} a${r} ${r} 0 1 0 ${2 * r} 0 a${r} ${r} 0 1 0 ${-2 * r} 0 Z`;
const ICONS = [
  [['M130 60 L400 60 L470 130 L470 540 L130 540 Z', 1], ['M400 60 L400 130 L470 130', 0], ['M190 250 L410 250', 0], ['M190 345 L360 345', 0]],
  [['M60 110 L140 110 L210 400 L475 400 L525 190 L160 190', 0], [circ(230, 505, 38), 1], [circ(450, 505, 38), 1], ['M210 400 L195 448 L480 448', 0]],
  [['M140 90 L380 90 L380 520 L140 520 Z', 1], ['M185 150 L335 150 L335 260 L185 260 Z', 1], ['M380 210 L440 210 Q470 210 470 240 L470 420 Q470 450 500 450 Q530 450 530 420 L530 180 L490 140', 0], ['M95 545 L425 545', 0]],
  [['M230 420 C230 360 160 320 160 230 A140 140 0 1 1 440 230 C440 320 370 360 370 420 Z', 1], ['M235 468 L365 468', 0], ['M255 515 L345 515', 0], ['M255 330 L280 268 L300 318 L320 268 L345 330', 0]],
  [['M70 300 L300 90 L530 300', 0], ['M130 250 L130 530 L470 530 L470 250', 0], ['M255 530 L255 410 L345 410 L345 530', 0], ['M400 180 L400 115 L450 115 L450 222', 0]],
  [['M70 425 L70 345 L135 325 L195 225 L405 225 L465 325 L530 345 L530 425 Z', 1], [circ(170, 432, 50), 1], [circ(430, 432, 50), 1], ['M222 318 L252 258 L348 258 L378 318 Z', 1]],
];
const NPT = 96;
let SHAPES = [];
function sampleIcons() {
  const tmp = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); tmp.style.position = 'absolute'; tmp.style.visibility = 'hidden'; document.body.appendChild(tmp);
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); tmp.appendChild(p);
  const raw = ICONS.map(ic => ic.map(([d, closed]) => {
    p.setAttribute('d', d); const L = p.getTotalLength(); const pts = [];
    for (let i = 0; i < NPT; i++) { const q = p.getPointAtLength(L * i / (NPT - 1)); pts.push([q.x, q.y]); }
    return { pts, closed };
  }));
  tmp.remove();
  // Alinea cada trazo cerrado con el anterior (giro y sentido) para que el morph no se retuerza.
  SHAPES = [raw[0].map(s => s.pts)];
  for (let k = 1; k < raw.length; k++) {
    SHAPES.push(raw[k].map((s, j) => {
      const src = SHAPES[k - 1][j];
      if (!s.closed || !raw[k - 1][j].closed) return s.pts;
      const u = s.pts.slice(0, NPT - 1); let best = null, bc = 1e18;
      for (const rev of [false, true]) {
        const v = rev ? u.slice().reverse() : u;
        for (let o = 0; o < u.length; o++) {
          let c = 0; for (let i = 0; i < u.length; i++) { const q = v[(i + o) % u.length]; c += (q[0] - src[i][0]) ** 2 + (q[1] - src[i][1]) ** 2; }
          if (c < bc) { bc = c; best = { v, o }; }
        }
      }
      const out = []; for (let i = 0; i < u.length; i++) out.push(best.v[(i + best.o) % u.length]); out.push(out[0]); return out;
    }));
  }
}
const dPts = pts => 'M' + pts.map(q => q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' L');

function makeStamp(parent, o, seed) {
  const s = el('div', 'stamp', parent); s.style.color = `var(${o.ink})`;
  const u = `url(${grungeURL(seed)})`; s.style.webkitMaskImage = u; s.style.maskImage = u;
  const i2 = el('div', 'in2', s); el('div', 's', i2, o.s); el('div', 'bg', i2, o.big);
  const r = rng(seed * 3 + 1);
  const dots = Array.from({ length: 10 }, () => { const d = el('div', 'dot', parent); d.style.color = `var(${o.ink})`; const a = r() * Math.PI * 2; return { d, a, v: 260 + r() * 420, sz: 8 + r() * 16 }; });
  return { s, dots, o, w: 0, h: 0 };
}
function drawStamp(S, t, extra) {

  show(markBox, mp > 0);
  if (mp > 0 && G.tot) {
    const c = G.tot, rx = 190, ry = 82, cx = c.x - 70, cy = c.y - 22, pts = [];
    for (let i = 0; i <= 60; i++) { const a = -2.2 + i / 60 * Math.PI * 2.15; const w = 1 + .06 * Math.sin(i * .9); pts.push([cx + Math.cos(a) * rx * w, cy + Math.sin(a) * ry * w]); }
    markPath.setAttribute('d', dPts(pts)); markPath.style.strokeDasharray = `${mp} 2`;
  }
  // zoom hacia el punto del «?»
  const zp = P(t, b(23.25), b(24) - b(23.25));
  if (zp > 0 && G.tot) {
    const S = Math.exp(Math.log(1900 / G.tot.r) * E.inCubic(zp));
    rec.style.transformOrigin = `${G.tot.x}px ${G.tot.y}px`;
    rec.style.transform = `scale(${S})`;
    show(rec, S < 14);
  } else rec.style.transform = 'none';
}

function brandR(t) {
  const on = t >= b(23.25);
  show(brand, t >= b(24) - .02);
  show(bcoin.c, on);
  if (!on) return;
  const ID = G.idot;
  // moneda: viene llenando la pantalla y se encoge hasta el punto de la «ı»
  if (t < b(24)) {
    const zp = P(t, b(23.25), b(24) - b(23.25)), S = Math.exp(Math.log(1900 / G.tot.r) * E.inCubic(zp));
    const r = G.tot.r * S;
    drawCoin(bcoin, G.tot.x, G.tot.y, r / 72, 1, 1, 0, 0, 0, 0);
  } else {
    const p = P(t, b(24), B), e = E.outExpo(p);
    let r = Math.exp(lerp(Math.log(1900), Math.log(ID.r), e));
    let x = lerp(G.tot.x, ID.x, E.outCubic(p)), y = lerp(G.tot.y, ID.y, E.outCubic(p));
    const tau = t - b(25);
    // saltito en el compás 30
    const hp = P(t, b(29.5), B); if (hp > 0 && hp < 1) y -= 150 * 4 * hp * (1 - hp);
    const u = t >= b(30) ? t - b(30) : tau;
    const sy = 1 - wob(u, .3, 38, 12), sx = 1 + wob(u, .24, 38, 12);
    const flip = hp > 0 && hp < 1 ? 2 * Math.PI * hp : 0;
    drawCoin(bcoin, x, y + r * (1 - sy) * .5, r / 72, sx, sy, 0, flip, 0, P(t, b(28), .6));
  }
  // letras que se inflan desde la moneda
  [BR1, BR2].forEach((o, li) => o.L.forEach((s, j) => {
    const c = li === 0 ? Math.abs(j - 5) : Math.abs(j - 1) + 2;
    const tt = t - (b(24) + .12 + c * .035 + li * .05), p = clamp(tt / .45);
    const e = E.outBack(p, 2.2);
    vf(s, lerp(50, 100, E.outCubic(p)) + 4 * Math.sin(t * 3 - j * .6) * P(t, b(26), 1), lerp(200, 900, E.outCubic(p)));
    s.style.opacity = p > 0 ? 1 : 0;
    s.style.transform = `translateY(${(1 - E.outCubic(p)) * 60}px) scale(${Math.max(0, e)})`;
  }));
  TW.forEach((s, i) => { const e = E.outBack(P(t, b(26) + i * .1, .4), 1.3); s.style.transform = `translateY(${(1 - e) * 110}%)`; });
  const pe = E.outBack(P(t, b(28), .4), 2.4);
  pill.style.transform = `scale(${pe}) rotate(${(1 - pe) * -8}deg)`;
  const arrow = pill.querySelector('svg');
  arrow.style.transform = `translate(${4 * Math.sin(t * 2 * Math.PI / B / 2) * P(t, b(28.5), .3)}px, ${-4 * Math.sin(t * 2 * Math.PI / B / 2) * P(t, b(28.5), .3)}px)`;
  bokeh.forEach(k => {
    const x = (k.x + t * 30 * k.z) % (W + 200) - 100, y = k.y - t * 50 * k.z + Math.sin(t + k.ph) * 20;
    k.d.style.transform = `translate(${x}px, ${((y % (H + 200)) + H + 200) % (H + 200) - 100}px)`;
    k.d.style.opacity = .16 * k.z * P(t, b(24.2), .8);
  });
}

const FLASH = [[b(4), .3, .12], [b(16), .9, .16], [b(24), .35, .14]];
let GRAIN = [];
function renderAt(t, frame) {
  if (frame == null) frame = Math.round(t * 30);
  const sk = shake(t);
  cam.style.transform = `translate(${sk.x}px, ${sk.y}px) rotate(${sk.r}deg)`;
  hookR(t); stationR(t); stormR(t); receiptR(t); brandR(t); heroR(t);
  let f = 0; FLASH.forEach(([h, a, d]) => { const u = t - h; if (u >= 0 && u < d) f = Math.max(f, a * (1 - u / d)); });
  flash.style.opacity = f;
  const r = rng(frame * 7 + 3);
  grain.style.backgroundPosition = `${Math.floor(r() * 256)}px ${Math.floor(r() * 256)}px`;
}
// Muestras de obturador por fotograma (desenfoque de movimiento): más donde hay barridos.
function SAMPLES(t) {
  const fast = [[0, .45], [b(3.2), b(4.3)], [b(11.6), b(12.3)], [b(15.9), b(16.6)], [b(23.4), b(24.9)]];
  if (fast.some(([a, c]) => t >= a && t < c)) return 12;
  if (t > b(28.6)) return 3;
  return 6;
}

async function boot() {
  await document.fonts.load('900 100px Anybody'); await document.fonts.load('600 40px "Instrument Sans"'); await document.fonts.load('700 40px "Instrument Sans"');
  await document.fonts.ready;
  grain.style.backgroundImage = `url(${noiseURL(256, 9, r => [Math.floor(r() * 255), 255])})`;
  layout();
  measureTotal();
  renderAt(0, 0);
  window.READY = true;
}
window.renderAt = renderAt; window.SAMPLES = SAMPLES; window.DUR = DUR;
boot();

document.getElementById('play').onclick = () => {
  const a = new Audio('audio.m4a'); a.play().catch(() => {});
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; renderAt(Math.min(t, DUR)); if (t < DUR) requestAnimationFrame(loop); };
  loop();
};
</script>
