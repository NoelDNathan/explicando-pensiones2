# Configuracion del proyecto Supabase.
#
# Dos decisiones importan mas que el resto:
#
# 1. `schemas` NO incluye "intake". Ese esquema guarda la ingesta anonima y no
#    debe ser alcanzable por HTTP ni con la anon key: solo lo escriben las Edge
#    Functions con service_role. Anyadirlo aqui abriria la puerta a ataques de
#    diferenciacion sobre los agregados.
#
# 2. Las funciones publicas llevan `verify_jwt = false` porque el envio anonimo
#    no manda cabecera Authorization. A cambio, la validacion del payload y el
#    limite de peticiones son la unica defensa que tienen: ver
#    supabase/functions/_shared/.

project_id = "explicando-pensiones"

[api]
enabled = true
port = 54321
# "intake" queda deliberadamente fuera.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
# Captura los correos en local: magic link, confirmacion de avisos y borrado de
# cuenta se prueban sin enviar nada de verdad.
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5173"
# Sin lista blanca, `emailRedirectTo` es un open redirect que entrega el token
# de acceso a donde diga quien construya el enlace.
additional_redirect_urls = ["http://localhost:5173/cuenta"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# No hay registro con contrasenya: se entra por enlace magico o por codigo de
# 6 digitos. La frase de cifrado es otra cosa y nunca llega al servidor.
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
# El OTP de 6 digitos es la alternativa al enlace: los escaneres antispam
# corporativos pre-abren los enlaces y queman el token de un solo uso.
otp_length = 6
otp_expiry = 3600
max_frequency = "60s"

[edge_runtime]
enabled = true
policy = "oneshot"

# --- Funciones ---------------------------------------------------------------
# Publicas: el cliente anonimo no tiene sesion que presentar.

[functions.knowledge-check]
verify_jwt = false

[functions.fiscal-stats]
verify_jwt = false

[functions.newsletter-subscribe]
verify_jwt = false

[functions.newsletter-confirm]
verify_jwt = false

[functions.newsletter-unsubscribe]
verify_jwt = false

# Esta si exige sesion: solo se puede pedir el borrado de la propia cuenta.
[functions.account-delete]
verify_jwt = true
